<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="eyebrow">String checker</p>
    <h1>Palindrome Checker</h1>
    <p class="lead">A palindrome reads the same forwards and backwards. Spacing and capitalization are ignored.</p>

    <form method="post" action="/">
      <label for="text-input">String</label>
      <input
        id="text-input"
        name="text"
        type="text"
        value="{{ text }}"
        placeholder="Try racecar or 12321"
        autocomplete="off"
        required
      >
      <button id="check-btn" type="submit">Check</button>
    </form>

    {% if result %}
    <p
      id="result"
      class="result {{ 'yes' if result.palindrome else 'no' }}"
      data-palindrome="{{ 'true' if result.palindrome else 'false' }}"
      role="status"
    >{{ result.message }}</p>
    {% endif %}
  </main>
</body>
</html>
